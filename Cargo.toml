[package]
name = "biscuit-sandbox"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["davlgd"]
description = "REST service creating short-lived sandbox containers, reachable through the biscuit-ssh bastion with Biscuit tokens"
repository = "https://github.com/davlgd/biscuit-sandbox"
readme = "README.md"
keywords = ["biscuit", "sandbox", "docker", "container", "ssh"]
categories = ["virtualization", "web-programming::http-server", "authentication"]

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
# From crates.io once published; `path` builds against a sibling checkout of
# the biscuit-ssh repository, and `cargo publish` drops it.
biscuit-ssh-core = { version = "0.3.0", path = "../biscuit-ssh/crates/core" }
biscuit-ssh-service = { version = "0.3.0", path = "../biscuit-ssh/crates/service", features = ["http"] }
bollard = "0.21.1"
clap = { version = "4.6.7", features = ["derive"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ssh-key = "0.6.7"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
toml = "1.2.1"
tracing = "0.1.44"
